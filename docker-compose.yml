services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: filetracking_user
      POSTGRES_PASSWORD: filetracking_password
      POSTGRES_DB: file_tracking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./SQL/schema:/docker-entrypoint-initdb.d
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://filetracking_user:filetracking_password@db:5432/file_tracking
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./SQL:/SQL
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: